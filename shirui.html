<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒類販売管理者標識</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Playwrite+US+Trad:wght@100..400&family=Sacramento&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="tokushoho-page shirui">
    <div class="tokushoho-container">
      <h1 class="tokushoho-title">酒類販売管理者標識</h1>
      
      <p class="tokushoho-desc">
        「酒税の保全及び酒類業組合等に関する<br/>法律施行規則」第11条の18（標識の掲示）に基づき、<br>
        酒類販売管理者標識を以下に掲示いたします。
      </p>
      
      <div class="tokushoho-table">
        <!-- Row 1 -->
        <div class="tokushoho-row">
          <div class="tokushoho-label">販売場の名称及び所在地</div>
          <div class="tokushoho-value">
            オリシャンエース<br>
            福岡県福岡市博多区上牟田3-6-12
          </div>
        </div>
        
        <!-- Row 2 -->
        <div class="tokushoho-row">
          <div class="tokushoho-label">酒類販売管理者の氏名</div>
          <div class="tokushoho-value">高住 大輔</div>
        </div>
        
        <!-- Row 3 -->
        <div class="tokushoho-row">
          <div class="tokushoho-label">酒類販売管理研修受講年月日</div>
          <div class="tokushoho-value">2025年9月1日</div>
        </div>
        
        <!-- Row 4 -->
        <div class="tokushoho-row">
          <div class="tokushoho-label">次回研修の受講期限</div>
          <div class="tokushoho-value">2028年8月31日</div>
        </div>
        
        <!-- Row 5 -->
        <div class="tokushoho-row">
          <div class="tokushoho-label">研修実施団体名</div>
          <div class="tokushoho-value">一般社団法人全国スーパーマーケット協会</div>
        </div>
      </div>

    </div>
  </div>
</body>

</html>
